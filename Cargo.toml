[package]
name = "monux"
version = "14.1.1"
authors = ["Montazar <github.mdtk4@passmail.com>"]
license = "AGPL-3.0-or-later"
edition = "2021"
readme = "README-CRATES.md"
description = "Low-latency LAN KVM: share keyboard, mouse, touchpad, and clipboard between Linux machines over QUIC/TLS (macOS clients supported for keyboard/mouse), with screen-edge switching (Hyprland)"
documentation = "https://github.com/mntzrr/monux"
homepage = "https://github.com/mntzrr/monux"
repository = "https://github.com/mntzrr/monux"
exclude = ["README.md", ".build.yml", "*.sh"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bit-vec = "0.9"
bytes = "1.4"
# clap "string" is load-bearing: the derive attributes in main.rs pass
# format!-produced Strings to version/long_about (From<String> for Str).
# "wrap_help" is load-bearing too: without it clap treats the terminal as
# infinitely wide and every flag description prints as one unwrapped line.
clap = { version = "4.4", features = ["derive", "string", "wrap_help"] }
hex = "0.4"
home = "0.5"
libc = "0.2"
mdns-sd = "0.20"
nonblock = "0.2"
pem = "3.0"
postcard = { version = "1.0", features = ["use-std"] }
# Defaults minus platform-verifier (unused; pulls rustls-platform-verifier +
# webpki-root-certs): certs are pinned via our own approval flow instead.
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring", "bloom"] }
rcgen = "0.14"
regex = "1.10"
# The "fs" feature is declared explicitly: on Linux other dependencies
# (wayland-client) enable it transitively, but the flock calls in
# single_instance.rs need it on every target.
rustix = { version = "1.1", features = ["fs"] }
# ring-only provider (approval.rs uses rustls::crypto::ring): the aws-lc-rs /
# prefer-post-quantum defaults only buy a heavy C/ASM build we never use.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
rustls-pemfile = "2.0"
rustls-pki-types = "1.7"
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
sha2 = "0.11"
signal-hook = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "net", "io-util", "time", "sync"] }
toml = "0.8"
# The config-file WRITER (mx config set/unset/revert/edit) edits through
# toml_edit so comments (history entries) and formatting survive; the daemon
# load path stays on plain toml. Pinned to the 0.22 line that toml 0.8 uses.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.4"
walkdir = "2.3"
zip = { version = "8.5", default-features = false, features = ["zstd"] }
zstd = "0.13"

os_pipe = { version = "1.1" }

# Linux-only platform layers: evdev input capture / uinput injection, the
# Wayland clipboard backend, the D-Bus tray, and the inotify device hotplug
# watch. macOS replaces the output path with CGEvent injection (see
# device/output/macos.rs) and gates the rest off.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["tokio"] }
ksni = { version = "0.3", features = ["blocking"] }
notify = "8.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# macOS input injection: pure-Rust bindings to CoreGraphics/CoreFoundation
# (CGEvent posting, cursor position, TCC accessibility check). "highsierra"
# enables CGEventCreateScrollWheelEvent2 for wheel injection.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra"] }
# macOS tray indicator (indicator_macos.rs): NSStatusItem menu-bar app.
# objc2-app-kit pulls its superclass features (NSResponder/NSControl/NSView)
# transitively; dispatch2 services UI updates from the poll thread on the
# main queue.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSAttributedString", "NSString", "NSTimer"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSColor", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusItem", "NSText", "NSView"] }
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3.10"

# Latency-sensitive daemon: favor runtime performance over compile time.
# panic stays at the default "unwind" and symbols are kept (no strip) so
# backtraces and crash reports stay useful.
[profile.release]
lto = "thin"
codegen-units = 1